<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ecardmitra-card.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f5" />
    <meta name="description" content="e-CardMitra helps independent neighborhood businesses share a digital visiting card and reach nearby customers." />
    <title>e-CardMitra | Good things are closer</title>
  </head>
  <body>
    <script>
      const url = new URL(location.href)
      const path = url.searchParams.get('__gh_pages_path')
      if (path !== null) {
        const search = url.searchParams.get('__gh_pages_search') || ''
        const hash = url.searchParams.get('__gh_pages_hash') || ''
        history.replaceState(null, '', `/eVisitingCard${path}${search}${hash}`)
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
